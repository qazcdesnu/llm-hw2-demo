# 헤드폰·이어폰 카테고리 정의. 작성법은 docs/category-spec.md 참고.
id: headphones
name: 헤드폰·이어폰
name_en: headphones & earbuds
description: 유선·무선 헤드폰, 이어폰, 이어버드

source:
  raw_file: meta_Electronics.jsonl
  category: Headphones & Earbuds

candidate_filter:
  require_price: true
  min_rating_number: 100

# 연결 방식·착용 방식이 확인된 후보를 모두 쓴다 (2026-10-26, 150개 샘플링에서 변경).
# size를 정하면 연결 방식 × 착용 방식 조합의 실제 비율대로 비례 층화 추출한다.
sampling:
  size: null
  seed: 42
  stratify_by: [connection, form_factor]
  require_known: [connection, form_factor]

attributes:
  - key: connection
    label: 연결 방식
    label_en: Connection
    question: 선 있는 것도 괜찮아, 아니면 무선이 좋아?
    question_en: Are you okay with a cable, or do you want wireless?
    values:
      - {value: wireless, label: 무선, label_en: Wireless}
      - {value: wired, label: 유선, label_en: Wired}
    rules:
      # "Wireless, Wired"처럼 둘 다 적힌 경우 무선으로 본다 (map은 위에서부터 먼저 맞는 값).
      - type: details
        keys: [Connectivity Technology, Connectivity technologies]
        map:
          wireless: wireless|bluetooth
          wired: wired
      - type: details
        keys: [Wireless Communication Technology, Wireless communication technologies]
        map:
          wireless: bluetooth
      # 텍스트의 "wired"/"3.5mm"는 무선 제품의 보조 단자 설명에도 나와서 무선만 판단한다.
      - type: keywords
        map:
          wireless: \bwireless\b|bluetooth|\btws\b

  - key: form_factor
    label: 착용 방식
    label_en: Fit
    question: 귀에 쏙 넣는 이어폰이 좋아, 귀를 덮는 헤드폰이 좋아?
    question_en: Do you like earbuds that sit in your ears, or headphones that cover them?
    values:
      - {value: in_ear, label: 이어폰(인이어), label_en: In-ear}
      - {value: on_ear, label: 온이어 헤드폰, label_en: On-ear}
      - {value: over_ear, label: 오버이어 헤드폰, label_en: Over-ear}
      - {value: open_ear, label: 오픈형(골전도 등), label_en: Open-ear (bone conduction etc.)}
    rules:
      - type: details
        keys: [Form Factor, Ear Placement]
        map:
          open_ear: open[- ]?ear|bone
          in_ear: in[- ]?ear|earbud
          on_ear: on[- ]?ear
          over_ear: over[- ]?ear|around[- ]?ear
      - type: categories
        map:
          open_ear: Open-Ear Headphones
          in_ear: Earbud Headphones
          on_ear: On-Ear Headphones
          over_ear: Over-Ear Headphones

  - key: anc
    label: 노이즈 캔슬링(ANC)
    label_en: Noise cancelling (ANC)
    question: 주변 소음 막아주는 노이즈 캔슬링 기능 있으면 좋겠어?
    question_en: Would you like noise cancelling that blocks out the sound around you?
    values:
      - {value: "yes", label: 필요, label_en: Needed}
      - {value: "no", label: 불필요, label_en: Not needed}
    rules:
      - type: keywords
        map:
          "yes": active noise|\banc\b|hybrid noise
    # ANC는 제품 설명에서 강조하는 기능이라, 설명이 있는데 언급이 없으면 없는 것으로 본다.
    default: "no"
    # 단, "noise cancelling"만 적힌 경우는 실제 ANC와 통화용 소음 제거(CVC/ENC), 마케팅 문구가 섞여 있어
    # (표본 25개 중 실제 ANC 약 3개) no로 단정하지 않고 unknown으로 둔다. LLM·수동 검증으로 확정.
    unknown_if: noise[- ]?cancel

  - key: price_band
    label: 가격대
    label_en: Price
    # 돌려 물으면("오래 쓸 거야?") 답을 가격대로 과하게 해석해서 직접 묻는다 (I-13).
    ask_directly: true
    question: 예산은 어느 정도 생각해? ($20 미만 / $20~60 / $60 이상)
    question_en: What's your budget roughly? (under $20 / $20-60 / $60+)
    values:
      - {value: low, label: $20 미만, label_en: Under $20}
      - {value: mid, label: $20~60, label_en: $20-60}
      - {value: high, label: $60 이상, label_en: $60+}
    rules:
      - type: band
        field: price
        bands:
          - {value: low, max: 20}
          - {value: mid, max: 60}
          - {value: high}

  - key: mic
    label: 마이크
    label_en: Mic
    question: 통화나 음성 채팅할 때도 쓸 거야?
    question_en: Will you use them for calls or voice chat too?
    values:
      - {value: "yes", label: 필요, label_en: Needed}
      - {value: "no", label: 불필요, label_en: Not needed}
    rules:
      - type: keywords
        fields: [title, features, description, details]
        map:
          "yes": \bmic\b|microphone|hands[- ]?free|calls?\b

  - key: water_resistant
    label: 방수·방진
    label_en: Water/sweat resistance
    question: 운동하면서 땀 흘리거나 비 오는 날에도 쓸 것 같아?
    question_en: Will you wear them while sweating at the gym or out in the rain?
    values:
      - {value: "yes", label: 필요, label_en: Needed}
      - {value: "no", label: 불필요, label_en: Not needed}
    rules:
      - type: keywords
        fields: [title, features, description, details]
        map:
          "yes": ipx ?\d|\bip\d\d\b|waterproof|water[- ]resistan|sweat[- ]?proof|sweat[- ]resistan

  - key: use_case
    label: 주 용도
    label_en: Main use
    # 상품도 사용자도 용도 하나로 정하기 어렵다(업무용으로 산 게이밍 헤드셋, 운동에도 쓰는 일상용).
    # 평가에서 정답이 밀린 원인의 대부분이라 묻지도 거르지도 않고, 동률 정렬에만 쓴다 (2026-10-31, I-13).
    askable: false
    constraint: false
    question: 주로 뭐 할 때 쓸 거야? 운동, 게임, 아이용, 아니면 일상용?
    question_en: What will you mostly use them for? Workouts, gaming, for a kid, or everyday?
    values:
      - {value: kids, label: 아이용, label_en: Kids}
      - {value: gaming, label: 게임, label_en: Gaming}
      - {value: sports, label: 운동, label_en: Sports}
      - {value: general, label: 일상, label_en: Everyday}
    rules:
      - type: keywords
        fields: [title, features]
        map:
          kids: \bkids?\b|children|volume[- ]limit
          gaming: gaming|gamer
          sports: \bsports?\b|running|workout|\bgym\b
    default: general

  - key: brand
    label: 브랜드
    label_en: Brand
    # 값이 많아 IG가 과대평가될 수 있어 일단 질문 대상에서 뺀다. 사용자가 먼저 말하면 조건으로는 쓴다.
    askable: false
    rules:
      - type: details
        keys: [Brand, Manufacturer]
